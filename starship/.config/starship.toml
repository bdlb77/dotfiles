# ~/.config/starship.toml
# Docs: https://starship.rs/config/

format = """
[](bold blue)\
$directory\
$git_branch\
$git_status\
$git_state\
$python\
$nodejs\
$ruby\
$golang\
$rust\
$bun\
$package\
$cmd_duration\
$line_break\
$character"""

add_newline = true
command_timeout = 1000

[character]
success_symbol = "[➜](bold green)"
error_symbol   = "[✗](bold red)"

[directory]
style = "bold cyan"
truncation_length = 4
truncate_to_repo = true
read_only = " "

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold yellow"
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "="
untracked = "?${count}"
modified  = "!${count}"
staged    = "+${count}"
renamed   = "»${count}"
deleted   = "✘${count}"
stashed   = "*${count}"

[cmd_duration]
min_time = 2000
format = "took [$duration](bold yellow) "

[python]
symbol = " "
format = 'via [$symbol${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[nodejs]
symbol = " "

[ruby]
symbol = " "

[golang]
symbol = " "

[rust]
symbol = " "

[bun]
symbol = " "

[package]
disabled = true
