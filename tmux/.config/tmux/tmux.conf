# ~/.config/tmux/tmux.conf
# Install plugin manager first:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then in tmux: prefix + I to install plugins

# ---- Prefix: C-a (more ergonomic than C-b) ----
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---- General ----
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-position top

# ---- Reload config ----
bind r source-file ~/.config/tmux/tmux.conf \; display-message "config reloaded"

# ---- Splits (intuitive, opens in cwd) ----
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ---- Vim-style pane navigation ----
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---- Vi mode for copy ----
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# ---- Plugins (tpm) ----
# Install tpm itself to ~/.tmux/plugins/tpm and have it install other plugins
# to ~/.tmux/plugins/ (NOT into the symlinked dotfiles dir).
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

# catppuccin theme settings
set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_status_style "rounded"

# continuum auto-restore
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# Initialize tpm (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
